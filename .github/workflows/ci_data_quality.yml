name: Data Quality & Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 lxml pyspark fastapi pydantic

      - name: Compile-check all PySpark Bronze, Silver, Gold, DAG, and Serving modules
        run: |
          python -m py_compile \
            scripts/spark/bronze/bronze_utils.py \
            scripts/spark/bronze/open_meteo.py \
            scripts/spark/bronze/nsmo.py \
            scripts/spark/bronze/hydro.py \
            scripts/spark/bronze/evn.py \
            scripts/spark/silver/silver_utils.py \
            scripts/spark/silver/llm_evidence_judge.py \
            scripts/spark/silver/transform_silver.py \
            scripts/spark/gold/build_gold_signals.py \
            airflow/dags/medallion_pipeline_dag.py \
            serving/api_and_mcp.py

      - name: Run Data Quality, Entity Resolution & Evidence Verifier Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
